# OAK-D Lite via depthai_ros_driver.
# Same /obstacle_sectors + /obstacle_detected contract as the old RealSense.

sector_obstacle_detector:
  ros__parameters:
    # depthai_ros_driver depth topic (32FC1, meters) for RGBD pipeline.
    depth_topic: "/oak/stereo/image_raw"
    near_distance_m: 1.0
    far_distance_m: 2.0
    min_obstacle_pixels: 200
    min_sector_pixels: 50
    # Keep the legacy topic name so robot_web_interface's depth-debug
    # subscription keeps working without an app-side change.
    debug_image_topic: "/camera/camera/depth/obstacle_debug"
    num_cols: 5

# ArUco dock-marker detector (precision docking). Publishes the marker pose in
# the camera optical frame on /docking/aruco_pose. Marker spec must match the
# printed marker (docking_aruco/marker_main_id0.pdf): DICT_4X4_50, ID 0, 150 mm.
aruco_dock_detector:
  ros__parameters:
    # Use the LIVE raw RGB stream, not /oak/rgb/image_rect. The rectified stream
    # is effectively dead (0 frames in 10 s on 2026-06-05), which starved the marker
    # pose to ~0.67 Hz. image_raw runs at the camera's real rate, and /oak/rgb/camera_info
    # carries the distortion D (rational_polynomial) so solvePnP(K,D) undistorts correctly.
    rgb_topic: "/oak/rgb/image_raw"
    camera_info_topic: "/oak/rgb/camera_info"
    pose_topic: "/docking/aruco_pose"
    marker_id: 0
    marker_id2: 1          # second marker for a robust dock normal; -1 = single-marker mode
    marker_length_m: 0.12  # MUST equal the printed black-square side (120 mm markers for the 0.40 m standoff)
    dictionary: "DICT_4X4_50"
    publish_debug: true
    debug_topic: "/docking/aruco_debug"
    max_range_m: 5.0
    max_reproj_error_px: 4.0

# Picked up by depthai_ros_driver when launched with params_file:=<this>.
# Factory intrinsics are loaded from the OAK EEPROM by the driver.
#
# RGBD is the only pipeline_type in this depthai-ros release that
# actually instantiates the stereo-depth node and publishes
# /oak/stereo/image_raw. (STEREO mode only brings up left/right/rgb
# mono streams — no depth.)
#
# Sync MUST stay disabled — explicitly enabling it under RGBD wires up
# a Sync node with no inputs and the component_container aborts with
# "Sync(13) - No inputs".
oak:
  ros__parameters:
    camera:
      i_pipeline_type: "RGBD"
      i_nn_type: "none"
      i_enable_imu: false
      i_enable_sync: false
      i_publish_tf_from_calibration: true
    pipeline_gen:
      i_enable_sync: false
    stereo:
      i_subpixel: true
      i_lr_check: true
      i_depth_preset: "HIGH_ACCURACY"
      i_low_bandwidth: false
      i_output_disparity: false
      i_height: 400
      i_width: 640
      # Lazy publisher waits for a matching-QoS subscriber before
      # pushing frames; force it off so depth always flows.
      i_enable_lazy_publisher: false
