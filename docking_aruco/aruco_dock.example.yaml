# Example ArUco precision-docking config.
#
# The live file is /routen/settings/aruco_dock.yaml — created/updated by
# docking_aruco/teach_dock_setpoint.py and read (every 2 s) by the
# tactical_wp_follower. If the live file is absent or `enabled: false`, docking
# uses the existing GPS line-follow unchanged.
#
# Keys map 1:1 to ArucoDockConfig in docking_state.py.
#
# AUTHORITY MODEL: GPS coarse-approaches and gates engagement; once the marker is
# acquired inside engage_distance, the MARKER owns BOTH steering (centre it) AND the
# longitudinal stop (camera->marker range vs the target standoff). GPS is the fallback
# only. There is no GPS/marker dual-authority over the stop.

# Master switch. Leave false until the steering sign is bench-verified (operator present).
enabled: false

# Engage the visual servo only inside this range (m) of the GPS charge point.
# Outside it the proven GPS line-follow drives.
engage_distance: 1.5

# Marker pose older than this (s) -> treated as lost (hold, then GPS fallback).
stale_timeout: 1.0

# --- Mode selection ---
# use_taught_setpoint: false -> markerless. The marker is a live centring reference and
#   its RANGE owns the stop at stop_range_m below. No taught pose needed.
# use_taught_setpoint: true  -> teach-and-repeat. Servo to setpoint_* (filled by the
#   teach tool); the stop is setpoint_range. center_marker may still force centring.
use_taught_setpoint: false
center_marker: true

# Target standoff (m) for markerless mode: the camera->marker range when perfectly
# docked. Operator measures once at the mated position. (Taught mode uses setpoint_range.)
stop_range_m: 0.85

# Hard anti-wall abort floor (m): MUST be below stop_range_m / the taught standoff. If
# the marker range ever falls below this the dock aborts (never push into the wall).
min_range_m: 0.70
range_floor_margin: 0.05   # taught mode also forbids creeping below setpoint_range - this

# Control gains (steering uses the -100..100 convention like the line-follower).
gain_lateral: 120.0     # steering per metre of lateral error
gain_yaw: 40.0          # steering per radian of bearing error (taught, non-centring only)
invert_steering: false  # set true if the bench test shows it steering AWAY from centre
creep_speed_ratio: 0.35 # forward creep while closing range (% of max speed; ~10% duty)
max_steering: 60.0      # cap; we are only cm from the dock

# Docked acceptance — tight, because vision precision is the point.
dock_lateral_tolerance: 0.04   # m off centre (markerless) / vs taught lateral
dock_range_tolerance: 0.03     # m vs the target standoff
dock_confirm_readings: 3       # consecutive in-tolerance fresh frames before docked

# Robustness / fail-soft.
max_range_jump: 0.3        # ignore (don't creep on) a frame whose range jumps > this (m)
reacquire_grace: 2.0       # marker briefly lost -> HOLD this long before GPS fallback
reengage_cooldown: 6.0     # after a servo->GPS revert, block re-engage this long (anti-oscillation)
servo_timeout: 25.0        # give up the servo after this -> GPS finishes

# Teach-and-repeat setpoint (filled by teach_dock_setpoint.py). IGNORED while
# use_taught_setpoint is false. setpoint_valid must be true to engage in taught mode.
setpoint_lateral: 0.0   # x in camera optical frame (m), + = marker to the right
setpoint_range: 0.0     # z in camera optical frame (m), distance to marker when docked
setpoint_yaw: 0.0       # marker-normal bearing in camera XZ plane (rad), 0 = head-on
setpoint_valid: false
