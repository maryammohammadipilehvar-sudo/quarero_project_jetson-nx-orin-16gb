services:
  ros2_livox:
    build:
      context: .
      dockerfile: docker/Dockerfile.ros2_jazzy_livox
    container_name: livox_ros2_jazzy
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    network_mode: host
    ipc: host
    pid: host
    volumes:
      - ./ros2_ws:/livox/ros2_ws
      - /home/quarero/gits/tactical_mower/.cursor:/home/quarero/gits/tactical_mower/.cursor
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 -W 2 192.168.10.3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 100
      # start_period: 30s
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        cd /livox/ros2_ws &&
        colcon build &&
        source /livox/ros2_ws/install/setup.bash &&
        /usr/local/bin/wait_for_lidar.sh ros2 launch livox_mid360_obstacle obstacle_detection.launch.py
      "